all:
  children:
    k8s_control_plane:
      hosts:
        gandalf-master1:
          ansible_host: 10.89.1.20
          node_ip: 10.89.1.20
    k8s_workers:
      hosts:
        gandalf-worker1:
          ansible_host: 10.89.1.25
          node_ip: 10.89.1.25
        gandalf-worker2:
          ansible_host: 10.89.1.26
          node_ip: 10.89.1.26
    k8s_cluster:
      children:
        k8s_control_plane:
        k8s_workers:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ lookup('env', 'K8S_USER') }}"
        ansible_password: "{{ lookup('env', 'K8S_PASSWORD') }}"
        ansible_become_password: "{{ lookup('env', 'K8S_BECOME_PASSWORD') | default(lookup('env', 'K8S_PASSWORD'), true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'K8S_SSH_KEY') | default(lookup('env', 'HOME') ~ '/.ssh/id_ed25519', true) }}"
        ansible_become: true
