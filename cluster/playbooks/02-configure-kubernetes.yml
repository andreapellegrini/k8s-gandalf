---
- name: Prepara i nodi CentOS per Kubernetes
  hosts: k8s_cluster
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verifica che ogni VM esponga la RAM prevista
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb | int >= item.memory_gb * 900
        fail_msg: >-
          {{ inventory_hostname }} vede {{ ansible_memtotal_mb }} MiB invece dei
          {{ item.memory_gb }} GB previsti. Arresta la VM, correggi StartupBytes
          su Hyper-V, riavviala e rilancia il playbook.
      loop: "{{ cluster_nodes | selectattr('name', 'equalto', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Imposta hostname persistente
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Imposta il nome host nell'inventario locale
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ node_ip }} {{ inventory_hostname }}"
        state: present

    - name: Disabilita swap attivo
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disabilita swap persistente in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Imposta SELinux in modalità permissiva
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Carica i moduli kernel necessari
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Applica subito i moduli kernel
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Configura i parametri sysctl di Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Ricarica sysctl

    - name: Installa repository e runtime containerd
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"

    - name: Installa containerd
      ansible.builtin.dnf:
        name: containerd.io
        state: present

    - name: Genera configurazione containerd predefinita
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Abilita il plugin CRI di containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '(?m)^disabled_plugins\s*=\s*\[.*\]\s*$'
        replace: 'disabled_plugins = []'
      notify: Riavvia containerd

    - name: Usa systemd come cgroup manager di containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Riavvia containerd

    - name: Abilita containerd
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true

    - name: Aggiungi repository Kubernetes
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes {{ kubernetes_minor_version }}
        baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/rpm/"
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/rpm/repodata/repomd.xml.key"

    - name: Installa kubelet, kubeadm e kubectl
      ansible.builtin.dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Abilita kubelet
      ansible.builtin.service:
        name: kubelet
        enabled: true

    - name: Avvia firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Consenti traffico Flannel VXLAN
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port=8472/udp
      register: firewall_flannel
      changed_when: "'ALREADY_ENABLED' not in firewall_flannel.stdout"
      notify: Ricarica firewalld

    - name: Consenti traffico kubelet
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port=10250/tcp
      register: firewall_kubelet
      changed_when: "'ALREADY_ENABLED' not in firewall_kubelet.stdout"
      notify: Ricarica firewalld

    - name: Consenti traffico memberlist MetalLB tra i nodi
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - "--add-port={{ item }}"
      loop:
        - 7946/tcp
        - 7946/udp
      register: firewall_metallb_memberlist
      changed_when: "'ALREADY_ENABLED' not in firewall_metallb_memberlist.stdout"
      notify: Ricarica firewalld

    - name: Consenti porte NodePort sui worker
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port=30000-32767/tcp
      when: inventory_hostname in groups['k8s_workers']
      register: firewall_nodeport
      changed_when: "'ALREADY_ENABLED' not in firewall_nodeport.stdout"
      notify: Ricarica firewalld

    - name: Consenti porte del control plane
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--permanent"
          - "--add-port={{ item }}"
      loop:
        - 6443/tcp
        - 2379-2380/tcp
        - 10257/tcp
        - 10259/tcp
      when: inventory_hostname in groups['k8s_control_plane']
      register: firewall_control_plane
      changed_when: "'ALREADY_ENABLED' not in firewall_control_plane.stdout"
      notify: Ricarica firewalld

  handlers:
    - name: Ricarica sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
    - name: Riavvia containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
    - name: Ricarica firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true

- name: Inizializza il control plane Kubernetes
  hosts: k8s_control_plane
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Scrive la configurazione kubeadm
      ansible.builtin.copy:
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: "0600"
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          clusterName: {{ cluster_name }}
          kubernetesVersion: stable-{{ kubernetes_minor_version }}
          networking:
            podSubnet: {{ pod_network_cidr }}
          controlPlaneEndpoint: "{{ node_ip }}:6443"
          apiServer:
            certSANs:
              - "{{ node_ip }}"
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "{{ node_ip }}"
            bindPort: 6443
          nodeRegistration:
            criSocket: unix:///run/containerd/containerd.sock

    - name: Inizializza Kubernetes
      ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Installa kubeconfig per l'utente Ansible
      ansible.builtin.shell: |
        install -d -m 0700 /home/{{ ansible_user }}/.kube
        install -m 0600 -o {{ ansible_user }} -g {{ ansible_user }} /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config
      args:
        creates: "/home/{{ ansible_user }}/.kube/config"

    - name: Installa Flannel CNI
      ansible.builtin.command: >-
        kubectl apply --kubeconfig=/etc/kubernetes/admin.conf
        -f https://github.com/flannel-io/flannel/releases/download/v0.26.3/kube-flannel.yml
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Crea comando di join per i worker
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Condivide il comando di join
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join.stdout }} --cri-socket unix:///run/containerd/containerd.sock"

- name: Unisce i worker al cluster
  hosts: k8s_workers
  become: true
  tasks:
    - name: Unisce il nodo worker
      ansible.builtin.command: "{{ hostvars[groups['k8s_control_plane'][0]].kubeadm_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Consente il traffico sulle interfacce CNI
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Attende la creazione dell'interfaccia VXLAN Flannel
      ansible.builtin.command: ip link show dev flannel.1
      register: flannel_interface
      changed_when: false
      retries: 30
      delay: 2
      until: flannel_interface.rc == 0

    - name: Aggiunge l'interfaccia Flannel alla zona trusted di firewalld
      ansible.posix.firewalld:
        zone: trusted
        interface: flannel.1
        permanent: true
        immediate: true
        state: enabled

    - name: Aggiunge cni0 alla zona trusted se esiste
      ansible.posix.firewalld:
        zone: trusted
        interface: cni0
        permanent: true
        immediate: true
        state: enabled
      when: "'cni0' in ansible_facts['interfaces']"

- name: Installa MetalLB dopo il join dei worker
  hosts: k8s_control_plane
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Attende che tutti i nodi siano Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    - name: Installa MetalLB
      ansible.builtin.command: >-
        kubectl apply --kubeconfig=/etc/kubernetes/admin.conf
        -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
      register: metallb_install
      changed_when: "'created' in metallb_install.stdout or 'configured' in metallb_install.stdout"

    - name: Attende il controller MetalLB
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        rollout status deployment/controller -n metallb-system --timeout=180s
      changed_when: false

    - name: Attende gli speaker MetalLB
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        rollout status daemonset/speaker -n metallb-system --timeout=180s
      changed_when: false

    - name: Configura il pool IP e l'annuncio L2 MetalLB
      ansible.builtin.copy:
        dest: /etc/kubernetes/metallb-config.yaml
        mode: "0600"
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: lan-pool
            namespace: metallb-system
          spec:
            addresses:
              - {{ metallb_ip_range }}
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: lan-advertisement
            namespace: metallb-system
          spec:
            ipAddressPools:
              - lan-pool

    - name: Applica la configurazione MetalLB
      ansible.builtin.command: >-
        kubectl apply --kubeconfig=/etc/kubernetes/admin.conf
        -f /etc/kubernetes/metallb-config.yaml
      register: metallb_config
      changed_when: "'created' in metallb_config.stdout or 'configured' in metallb_config.stdout"
