all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
    remote_linux:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ lookup('ansible.builtin.env', 'K8S_USER') }}"
        ansible_password: "{{ lookup('ansible.builtin.env', 'K8S_PASSWORD') }}"
        ansible_become_password: "{{ lookup('ansible.builtin.env', 'K8S_BECOME_PASSWORD') | default(lookup('ansible.builtin.env', 'K8S_PASSWORD'), true) }}"
        ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'K8S_SSH_KEY') | default(lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519', true) }}"
        ansible_become: true
      children:
        k8s_nodes:
          hosts:
            gandalf-master1:
              ansible_host: 10.89.1.20
            gandalf-worker1:
              ansible_host: 10.89.1.25
            gandalf-worker2:
              ansible_host: 10.89.1.26
        nfs_server:
          hosts:
            gandalf-storage1:
              ansible_host: "{{ nfs_server_ip }}"